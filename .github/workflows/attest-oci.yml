---
name: Trusted attest (OCI)

# THE TRUSTED BUILDER, image edition. Same boundary and same single rule as
# attest.yml:
#
#   NOTHING IN THIS JOB IS SUPPLIED BY THE CALLER EXCEPT DECLARED VALUES.
#
# No `actions/checkout`, no caller scripts, no build, no `docker build`. The
# job that holds `id-token: write` receives a name and a digest — two
# strings — and signs them.
#
# Separate from attest.yml rather than a flag on it, because the subject
# shapes are genuinely different: `subject-checksums` derives many subjects
# from a file of digests, while an image is exactly one subject identified
# by `subject-name` + `subject-digest`. Folding them together would mean a
# workflow whose required inputs depend on a mode switch, in the file where
# clarity matters most.
#
# Consumers verify with:
#
#   gh attestation verify oci://<image>@<digest> \
#     --repo <owner>/<source-repo> \
#     --signer-workflow <owner>/trusted-builder/.github/workflows/attest-oci.yml \
#     --signer-digest <builder-commit-sha>
#
# --signer-workflow, never --signer-repo: this repository also contains
# workflows that legitimately run caller code, so only a file-level pin keeps
# the zones apart. See README.md.

"on":
  workflow_call:
    inputs:
      subject-name:
        description: >
          Fully-qualified image name WITHOUT a tag or digest, e.g.
          `ghcr.io/owner/image`. Lowercased by the action for OCI conformance.
        required: true
        type: string
      subject-digest:
        description: >
          Image digest as `sha256:<64 hex>`. Validated here before use — an
          unvalidated digest is a subject the caller could shape freely.
        required: true
        type: string
      push-to-registry:
        description: >
          Also write the attestation into the registry as an OCI referrer, so
          registry-native tooling (cosign, docker) discovers it without going
          through GitHub's API.
          COSTS SOMETHING REAL: it requires the caller to grant this job
          `packages: write`, which hands a shared signing workflow write
          access to the caller's registry. Default false — the attestation is
          still stored in GitHub's attestation API, which is where
          `gh attestation verify` looks unless told otherwise. Turn it on per
          repository, deliberately.
        required: false
        type: boolean
        default: false
    outputs:
      attestation-id:
        description: GitHub's ID for the stored attestation.
        value: ${{ jobs.attest.outputs.attestation-id }}

permissions: {}

jobs:
  attest:
    name: Sign provenance over the declared image
    runs-on: ubuntu-latest
    # Hang guard, not a budget: two strings and one signature.
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC: the Sigstore signing identity
      attestations: write # store the provenance GitHub serves to verifiers
      contents: read
      # Required, and the caller must grant it: a called workflow only gets
      # the scopes it DECLARES, so omitting this made `push-to-registry: true`
      # impossible — it would have failed at the registry write. Found by
      # building the lab scenario rather than by review.
      #
      # This is the one scope the image signer needs beyond the file signer,
      # and it is a real capability increase: registry write on the caller's
      # namespace, held by a shared workflow. It is bounded by this job
      # running no caller-supplied code at all. A caller unwilling to grant
      # it should not use this workflow.
      packages: write # write the attestation into the registry as a referrer
    outputs:
      attestation-id: ${{ steps.attest.outputs.attestation-id }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443

      # Both caller-supplied values are validated before they reach the
      # action, and neither is ever expanded into `run:` code.
      - name: Validate the declared subject
        env:
          UNTRUSTED_SUBJECT_NAME: ${{ inputs.subject-name }}
          UNTRUSTED_SUBJECT_DIGEST: ${{ inputs.subject-digest }}
        run: |
          set -euo pipefail

          if [[ ! ${UNTRUSTED_SUBJECT_DIGEST} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::subject-digest must be sha256:<64 hex>, got '${UNTRUSTED_SUBJECT_DIGEST}'"
            exit 1
          fi

          # A tag or digest suffix here would silently produce an attestation
          # whose subject name does not match what a verifier passes to
          # `gh attestation verify oci://…`, and the mismatch would only
          # surface at verification time — on someone else's machine.
          if [[ ${UNTRUSTED_SUBJECT_NAME} == *:* || ${UNTRUSTED_SUBJECT_NAME} == *@* ]]; then
            echo "::error::subject-name must carry no tag and no digest, got '${UNTRUSTED_SUBJECT_NAME}'"
            exit 1
          fi

          if [[ ! ${UNTRUSTED_SUBJECT_NAME} =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::subject-name contains characters that are not valid in an image reference"
            exit 1
          fi

          echo "::notice::signing ${UNTRUSTED_SUBJECT_NAME}@${UNTRUSTED_SUBJECT_DIGEST}"

      # Registry auth is needed ONLY on the push-to-registry path. Guarded, so
      # the default path holds no registry credential at all.
      - name: Log in to GHCR
        if: inputs.push-to-registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        id: attest
        with:
          subject-name: ${{ inputs.subject-name }}
          subject-digest: ${{ inputs.subject-digest }}
          push-to-registry: ${{ inputs.push-to-registry }}
