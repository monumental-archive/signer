---
name: Trusted verify

# The stranger's path, run in-pipeline: verify the attestations the way a
# consumer will, against the identity the published instructions name, before
# anything is made public.
#
# Deliberately a SEPARATE workflow from attest.yml, and deliberately holding
# NO `id-token`. It handles artifact bytes, which the signing job must never
# do; keeping the two apart means the job that touches bytes cannot sign and
# the job that signs cannot touch bytes.
#
# A bare `gh attestation verify` is not a check — it passes on artifacts whose
# provenance names a commit that built none of them (edtf#54, v1.0.0, which is
# permanent). The pins below are the check:
#
#   --repo              the SOURCE repository the artifact claims to come from
#   --source-ref        the tag this release is for
#   --source-digest     the commit that tag points at
#   --signer-workflow   which workflow was permitted to sign at all
#   --signer-digest     which COMMIT of that workflow signed
#
# --signer-workflow alone is weaker than it looks: `gh` compiles it to a
# prefix regex over the certificate SAN
# (`^https://github\.com/<owner>/<repo>/\.github/workflows/<file>`), so the
# path is pinned and the `@ref` is not. Anyone able to push a branch in the
# builder repository produces a matching signer identity. --signer-digest
# pins `job_workflow_sha` and is what actually closes that.

"on":
  workflow_call:
    inputs:
      artifacts-artifact:
        description: Name of the Actions artifact holding the files to verify.
        required: true
        type: string
      artifacts-path:
        description: Directory inside that artifact whose files are verified.
        required: false
        type: string
        default: dist
      source-repo:
        description: Source repository the artifacts claim to come from.
        required: true
        type: string
      source-ref:
        description: Git ref the provenance must name (e.g. refs/tags/v1.2.3).
        required: true
        type: string
      source-digest:
        description: Commit SHA the provenance must name.
        required: true
        type: string
      signer-workflow:
        description: >
          Full path of the workflow permitted to have signed, as
          <owner>/<repo>/.github/workflows/<file>. Required, never defaulted —
          a verification pin should be stated by the caller, not inherited.
        required: true
        type: string
      signer-digest:
        description: >
          Commit SHA of the signer workflow. Optional only because a caller may
          not know it before the first run; supply it once known.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  verify:
    name: Verify as a consumer would
    runs-on: ubuntu-latest
    # Hang guard, not a budget: downloads plus one verify call per artifact.
    timeout-minutes: 20
    permissions:
      # Read-only throughout, and no id-token: this job handles artifact
      # bytes, so it must not be able to sign.
      #
      # `contents: read` is the whole grant a caller needs. Requesting more
      # than the caller granted is an elevation, and a called workflow may
      # only downgrade — the run then dies as `startup_failure` with no jobs
      # and nothing to read. Keep this list minimal for that reason as much
      # as for least privilege.
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            search.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443

      - name: Download the artifacts to verify
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifacts-artifact }}

      # Every caller-supplied value through env, never expanded into `run:`.
      - name: Verify every artifact against the declared identity
        env:
          GH_TOKEN: ${{ github.token }}
          UNTRUSTED_PATH: ${{ inputs.artifacts-path }}
          UNTRUSTED_SOURCE_REPO: ${{ inputs.source-repo }}
          UNTRUSTED_SOURCE_REF: ${{ inputs.source-ref }}
          UNTRUSTED_SOURCE_DIGEST: ${{ inputs.source-digest }}
          UNTRUSTED_SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          UNTRUSTED_SIGNER_DIGEST: ${{ inputs.signer-digest }}
        run: |
          set -euo pipefail

          # --signer-digest is appended only when supplied, so an unset value
          # cannot silently become an empty-string pin that matches nothing
          # (or, worse, is ignored).
          extra=()
          if [[ -n ${UNTRUSTED_SIGNER_DIGEST} ]]; then
            extra+=(--signer-digest "${UNTRUSTED_SIGNER_DIGEST}")
          else
            echo "::warning::no signer-digest supplied — the signer workflow's path is pinned but its ref is not"
          fi

          fail=0
          checked=0

          # Retried, with stderr kept. At edtf v1.0.1 every artifact "failed"
          # here and the real cause — a blocked egress host, not bad
          # provenance — was invisible because stderr was swallowed (edtf#66).
          # The retries additionally cover the attestation API's
          # read-after-write lag.
          for artifact in "${UNTRUSTED_PATH}"/*; do
            [[ -f ${artifact} ]] || continue
            checked=$((checked + 1))
            verified="false"
            for attempt in 1 2 3; do
              if gh attestation verify "${artifact}" \
                --repo "${UNTRUSTED_SOURCE_REPO}" \
                --source-ref "${UNTRUSTED_SOURCE_REF}" \
                --source-digest "${UNTRUSTED_SOURCE_DIGEST}" \
                --signer-workflow "${UNTRUSTED_SIGNER_WORKFLOW}" \
                --deny-self-hosted-runners \
                "${extra[@]}" \
                > /dev/null 2> "${RUNNER_TEMP}/verify-stderr.txt"; then
                verified="true"
                break
              fi
              [[ ${attempt} -lt 3 ]] && sleep 20
            done

            if [[ ${verified} == "true" ]]; then
              echo "ok  $(basename "${artifact}")"
            else
              echo "::error::$(basename "${artifact}"): verification failed"
              cat "${RUNNER_TEMP}/verify-stderr.txt"
              fail=1
            fi
          done

          # A zero-artifact loop must not pass silently — that is the check
          # reporting success for having verified nothing.
          if [[ ${checked} -eq 0 ]]; then
            echo "::error::no artifacts found under ${UNTRUSTED_PATH}/ to verify"
            exit 1
          fi

          [[ ${fail} -eq 0 ]] || exit 1

          echo "::notice::${checked} artifacts verified"
          echo "::notice::  source ${UNTRUSTED_SOURCE_REPO} @ ${UNTRUSTED_SOURCE_REF}"
          echo "::notice::  signer ${UNTRUSTED_SIGNER_WORKFLOW}"
