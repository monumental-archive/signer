# The org gate. This stub is a repo's entire CI obligation: everything else
# (linters, versions, enforcement) arrives via the shared workflow and the
# toolbelt it pins. Update the SHA when moving to a newer gate; once the
# .github repo cuts releases, Renovate manages this pin like any other.
---
name: gate

"on":
  # `edited` included because the squash subject is the PR title:
  # without it a title edit leaves a stale verdict standing
  # (.github#427).
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

  push:
    branches:
      - main
  # The merge queue runs the gate on its own temporary branch; without
  # this trigger a queued pull request waits for a check that cannot
  # report (monumental-archive/.github#1117, lint:gate-stub).
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      # Stated, not inherited. A `uses:` job takes the WORKFLOW-level
      # default rather than any ambient grant, so when a shared workflow
      # gains a permission every caller that stayed silent dies as
      # startup_failure with no jobs and no log. Saying it here makes the
      # contract a diff rather than a mystery.
      contents: read # checkout of this repo and of the toolbelt
    uses: monumental-archive/.github/.github/workflows/ci.yml@35bed816154605934907089514935cc0b2f9aa51 # v1.64.4
...
