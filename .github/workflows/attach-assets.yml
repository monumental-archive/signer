---
name: Attach release assets

# UNTRUSTED ZONE. `contents: write`, and therefore NEVER `id-token: write` —
# see README.md, "Pin the workflow, never the repository".
#
# Attaches assets to releases that are still DRAFTS, idempotently, so a run
# that died partway can be re-dispatched and converge.
#
# The `policy` input is not a preference. edtf's defect ledger contains BOTH
# policies, as fixes for opposite failures, and choosing wrong in either
# direction has cost a release:
#
#   skip-if-present      — for deterministic, per-artifact files (SBOMs,
#                          attestation bundles). `upload-sboms.sh` once
#                          clobbered unconditionally, which made every resume
#                          after a partial publish FATAL: publish-releases
#                          deliberately stops mid-loop, so a re-dispatch
#                          reaches this step with some releases already
#                          published and immutable. `--clobber` deletes
#                          before uploading, and an immutable release refuses
#                          both — so the documented recovery path was
#                          permanently blocked by the one surviving
#                          `--clobber` in the pipeline.
#
#   replace-while-draft  — for REBUILT binaries (tarballs, and the SHA256SUMS
#                          that describes them). Skipping by name is wrong
#                          here, and dangerously so: a re-dispatched run
#                          rebuilds the binaries, those bytes are explicitly
#                          not claimed reproducible, and the checksums file is
#                          regenerated over the NEW bytes. Skipping would
#                          leave the release carrying run 1's tarballs beside
#                          run 2's manifest — a published, immutable release
#                          whose checksums contradict its own assets — and the
#                          canary would then compare fresh digests against
#                          stale published ones and fail forever, so the
#                          release could never be completed at all.
#
# Drafts are mutable, which is the entire reason phase 1 stops short of
# publishing. Both policies exploit that; they differ only in what they do
# when a name already exists.
#
# Either way the final read-back is the check that matters. On the published
# path it is the ONLY check that runs, and an immutable release missing an
# asset cannot be repaired in place.

"on":
  workflow_call:
    inputs:
      artifacts-artifact:
        description: Name of the Actions artifact holding the assets.
        required: true
        type: string
      artifacts-path:
        description: Directory inside that artifact holding the assets.
        required: false
        type: string
        default: dist
      manifest:
        description: >
          Newline-separated `<release-tag> <asset-filename>` pairs. ENUMERATED,
          never globbed — a glob is what silently skipped a crate at edtf
          v1.0.0, and a partial attach is otherwise invisible: the release
          simply carries fewer assets than intended.
        required: true
        type: string
      expected-count:
        description: >
          How many pairs the caller believes it is attaching. Checked against
          the parsed manifest, so a truncated input fails here rather than
          shipping a short asset set.
        required: true
        type: number
      policy:
        description: >
          `skip-if-present` for deterministic per-artifact files;
          `replace-while-draft` for rebuilt binaries. See the header — this
          is a correctness choice, not a style one.
        required: true
        type: string

permissions: {}

jobs:
  attach:
    name: Attach and prove the whole set landed
    runs-on: ubuntu-latest
    # Hang guard, not a budget: uploads plus a read-back per release.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443

      - name: Download the assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifacts-artifact }}

      - name: Attach every declared asset
        env:
          GH_TOKEN: ${{ github.token }}
          # `github` context in a called workflow is the CALLER's.
          REPO: ${{ github.repository }}
          UNTRUSTED_PATH: ${{ inputs.artifacts-path }}
          UNTRUSTED_MANIFEST: ${{ inputs.manifest }}
          UNTRUSTED_EXPECTED_COUNT: ${{ inputs.expected-count }}
          UNTRUSTED_POLICY: ${{ inputs.policy }}
        run: |
          set -euo pipefail

          case "${UNTRUSTED_POLICY}" in
            skip-if-present | replace-while-draft) ;;
            *)
              echo "::error::unknown policy '${UNTRUSTED_POLICY}'"
              echo "::error::expected skip-if-present or replace-while-draft"
              exit 1
              ;;
          esac

          mapfile -t PAIRS < <(grep -v '^[[:space:]]*$' <<< "${UNTRUSTED_MANIFEST}")

          if [[ ${#PAIRS[@]} -ne ${UNTRUSTED_EXPECTED_COUNT} ]]; then
            echo "::error::expected ${UNTRUSTED_EXPECTED_COUNT} manifest entries, parsed ${#PAIRS[@]}"
            exit 1
          fi

          # Plain statements, never functions-as-conditions (SC2310): under
          # `set -e` the flag is suspended inside a function, so a failed API
          # call must not read as "asset absent" or "release is a draft".
          declare -A DRAFT_STATE=()
          declare -A ATTACHED=()

          read_release() {
            local tag="$1"
            [[ -n ${DRAFT_STATE[${tag}]:-} ]] && return 0
            local state=""
            state=$(gh release view "${tag}" --repo "${REPO}" \
              --json isDraft --jq .isDraft 2> /dev/null) || state=""
            if [[ -z ${state} ]]; then
              echo "::error::release ${tag} does not exist — phase 1 did not create it"
              exit 1
            fi
            DRAFT_STATE[${tag}]="${state}"
            local names=""
            names=$(gh release view "${tag}" --repo "${REPO}" \
              --json assets --jq '.assets[].name' 2> /dev/null) || names=""
            ATTACHED[${tag}]="${names}"
          }

          for pair in "${PAIRS[@]}"; do
            read -r tag asset <<< "${pair}"
            if [[ -z ${tag} || -z ${asset} ]]; then
              echo "::error::malformed manifest entry: '${pair}'"
              exit 1
            fi
            src="${UNTRUSTED_PATH}/${asset}"
            if [[ ! -f ${src} ]]; then
              echo "::error::no such asset in the artifact: ${src}"
              exit 1
            fi

            read_release "${tag}"

            if [[ ${DRAFT_STATE[${tag}]} != "true" ]]; then
              # Published and immutable. Nothing can be attached; the
              # read-back below decides whether that is fatal.
              echo "::notice::${tag} is already published; assets are immutable"
              continue
            fi

            if [[ ${UNTRUSTED_POLICY} == "skip-if-present" ]] \
              && grep -qxF "${asset}" <<< "${ATTACHED[${tag}]}"; then
              echo "::notice::${asset} already attached to ${tag}; skipping"
              continue
            fi

            if [[ ${UNTRUSTED_POLICY} == "replace-while-draft" ]]; then
              gh release upload "${tag}" "${src}" --repo "${REPO}" --clobber
            else
              gh release upload "${tag}" "${src}" --repo "${REPO}"
            fi
            echo "::notice::attached ${asset} to ${tag}"
          done

          # Prove the whole set landed, whether this run attached it or a
          # prior one did. Without this a partial attach is invisible.
          missing=()
          for pair in "${PAIRS[@]}"; do
            read -r tag asset <<< "${pair}"
            final=""
            final=$(gh release view "${tag}" --repo "${REPO}" \
              --json assets --jq '.assets[].name' 2> /dev/null) || final=""
            if ! grep -qxF "${asset}" <<< "${final}"; then
              missing+=("${tag}/${asset}")
              if [[ ${DRAFT_STATE[${tag}]:-} != "true" ]]; then
                echo "::error::${tag} is published and immutable — this cannot be repaired in place"
              fi
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::not attached after upload: ${missing[*]}"
            exit 1
          fi

          echo "::notice::all ${#PAIRS[@]} assets attached (${UNTRUSTED_POLICY})"
