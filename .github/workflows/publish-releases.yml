---
name: Publish draft releases

# UNTRUSTED ZONE. This workflow runs with `contents: write` and therefore
# must NEVER be granted `id-token: write` — a certificate minted here would
# bear this repository's identity, and consumers pin `--signer-workflow` to
# attest.yml precisely so that a release-half workflow cannot sign. See
# README.md, "Pin the workflow, never the repository".
#
# What it does: publishes releases that phase 1 created as DRAFTS, last, once
# every asset is attached — one at a time, verifying immutability before
# moving to the next.
#
# Ported from edtf's publish-releases.sh. Every rule below was paid for by a
# live release; the only change is that the release list arrives as a
# declared input instead of being hardcoded.
#
# Why drafts at all: immutability is enforced at PUBLISH, not at creation, so
# every asset has to be attached first. The opposite shape — publish early,
# attach later with `gh release upload --clobber` — is refused outright once
# immutable releases are on, and the release can then never be completed.
#
# Why ONE AT A TIME: a release published while the repository's
# immutable-releases setting is off stays mutable PERMANENTLY, and neither
# `gh release edit` nor a re-dispatch can retrofit it. The obvious guard —
# reading GET /repos/{owner}/{repo}/immutable-releases — is unavailable to
# CI, because `administration` is not a grantable workflow permission scope,
# so GITHUB_TOKEN cannot read repository settings. The check is therefore
# made against the only thing this job can observe: a release it has just
# published. Sequential publishing bounds the blast radius to one.

"on":
  workflow_call:
    inputs:
      releases:
        description: >
          Newline-separated release tags to publish, in order. ENUMERATED,
          never globbed or derived: a glob is what silently skipped a crate
          at edtf v1.0.0, and the count assertion below is only meaningful
          against an explicit list.
        required: true
        type: string
      expected-count:
        description: >
          How many releases the caller believes it is publishing. Checked
          against the parsed list, so a truncated or mis-quoted input fails
          here rather than shipping a short release set.
        required: true
        type: number

permissions: {}

jobs:
  publish:
    name: Publish drafts, one at a time
    runs-on: ubuntu-latest
    # Hang guard, not a budget: a handful of API calls per release.
    timeout-minutes: 20
    permissions:
      # Publishing drafts is a write. No id-token, ever — see the header.
      contents: write # flip the caller's draft releases to published
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Publish each draft and prove it is immutable
        env:
          GH_TOKEN: ${{ github.token }}
          # `github` context inside a called workflow is the CALLER's, so
          # this names the calling repository — which is the one whose
          # releases are being published.
          REPO: ${{ github.repository }}
          UNTRUSTED_RELEASES: ${{ inputs.releases }}
          UNTRUSTED_EXPECTED_COUNT: ${{ inputs.expected-count }}
        run: |
          set -euo pipefail

          mapfile -t TAGS < <(grep -v '^[[:space:]]*$' <<< "${UNTRUSTED_RELEASES}" | sed 's/[[:space:]]*$//')

          if [[ ${#TAGS[@]} -ne ${UNTRUSTED_EXPECTED_COUNT} ]]; then
            echo "::error::expected ${UNTRUSTED_EXPECTED_COUNT} releases, parsed ${#TAGS[@]}"
            printf '::error::  parsed: %s\n' "${TAGS[@]:-<none>}"
            exit 1
          fi

          # Read a release's draft/immutable state by tag, via the LIST
          # endpoint.
          #
          # NOT releases/tags/{tag}: that endpoint 404s on DRAFT releases,
          # and every release this workflow is asked to publish is a draft by
          # definition — so the obvious lookup fails on precisely its
          # intended input. The list endpoint returns drafts and is the only
          # one that also exposes `.immutable`. Paginated, because the
          # default page holds thirty.
          #
          # Sets STATE rather than returning it: under `set -e` the flag is
          # suspended inside a function (shellcheck SC2310), so a failed API
          # call must not be readable as a legitimate value.
          STATE=""
          read_state() {
            STATE=$(gh api --paginate "repos/${REPO}/releases" \
              --jq ".[] | select(.tag_name == \"$1\") | \"\(.draft) \(.immutable)\"" \
              2> /dev/null) || STATE=""

            # GitHub permits several DRAFTS to share a tag_name — drafts have
            # no ref to make them unique. Two matches would concatenate into
            # a two-line STATE matching neither expected value, and the run
            # would fail with an unreadable value instead of naming the real
            # problem.
            local matches=0
            matches=$(grep -c . <<< "${STATE}") || matches=0
            if [[ ${matches} -gt 1 ]]; then
              echo "::error::more than one release carries the tag $1:"
              echo "${STATE}"
              echo "::error::delete the duplicate drafts before releasing"
              exit 1
            fi
          }

          for tag in "${TAGS[@]}"; do
            read_state "${tag}"

            if [[ -z ${STATE} ]]; then
              echo "::error::release ${tag} does not exist — phase 1 did not create it"
              exit 1
            fi

            # Idempotent: a re-dispatch after a partial run converges rather
            # than erroring.
            if [[ ${STATE} == "false true" ]]; then
              echo "ok  ${tag}  already published, immutable"
              continue
            fi

            if [[ ${STATE} == "false "* ]]; then
              # Published already, but mutable: a PRE-EXISTING condition from
              # an earlier run that cannot be corrected in place. Warn and
              # carry on — failing here would strand the remaining drafts
              # permanently, refusing on this release every time it was
              # re-dispatched, which is the opposite of the documented
              # recovery path.
              echo "::warning::${tag} was already published without immutability (${STATE})"
              echo "::warning::its assets are mutable and cannot be sealed retroactively"
              continue
            fi

            gh release edit "${tag}" --repo "${REPO}" --draft=false

            # Read back immediately. Anything other than
            # published-and-immutable stops the run here, leaving every
            # remaining release a draft.
            read_state "${tag}"

            if [[ ${STATE} != "false true" ]]; then
              echo "::error::${tag}: expected draft=false immutable=true, got '${STATE:-unreadable}'"
              echo "::error::immutable releases appear to be DISABLED on ${REPO}"
              echo "::error::enable it, then re-dispatch — the remaining releases are still drafts:"
              echo "::error::  gh api --method PUT repos/${REPO}/immutable-releases"
              exit 1
            fi

            echo "ok  ${tag}  published, immutable"
          done

          echo "::notice::all ${#TAGS[@]} releases published and immutable"
