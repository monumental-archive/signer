---
name: Trusted verify (OCI)

# The stranger's check for images, run in-pipeline before anything is
# published — the counterpart to verify.yml, which handles files.
#
# Holds NO `id-token`, deliberately: it touches registry content, and the job
# that touches artifacts must never be able to sign them.
#
# A bare `gh attestation verify` is not a check. The pins below are:
#
#   --repo             the SOURCE repository the image claims to come from
#   --source-ref       the ref the provenance must name
#   --source-digest    the commit the provenance must name
#   --signer-workflow  which workflow was permitted to sign at all
#   --signer-digest    which COMMIT of that workflow signed
#
# `--signer-workflow` compiles to a PREFIX regex over the certificate SAN, so
# it pins the workflow path and leaves the `@ref` open — an attestation from
# that workflow on any branch satisfies it. `--signer-digest` pins
# `job_workflow_sha` and is what actually closes that gap.
#
# CALLER CONTRACT — grant exactly:
#
#   permissions:
#     contents: read
#     packages: read
#
# A called workflow may only DOWNGRADE the caller's grant. Requesting a scope
# the caller withheld kills the run as `startup_failure` with no jobs, no
# annotations and no log, and no local linter can catch it because the
# contract spans two repositories.

"on":
  workflow_call:
    inputs:
      image:
        description: >
          Fully-qualified image name, no tag and no digest — e.g.
          `ghcr.io/owner/image`.
        required: true
        type: string
      digest:
        description: Image digest as `sha256:<64 hex>`.
        required: true
        type: string
      source-repo:
        description: Source repository the image claims to come from.
        required: true
        type: string
      source-ref:
        description: >
          Git ref the provenance must name. For a rolling image with no
          releases this is a branch (`refs/heads/main`), not a tag.
        required: true
        type: string
      source-digest:
        description: Commit SHA the provenance must name.
        required: true
        type: string
      signer-workflow:
        description: >
          Full path of the workflow permitted to have signed, as
          <owner>/<repo>/.github/workflows/<file>. Required, never defaulted —
          a verification pin should be stated by the caller.
        required: true
        type: string
      signer-digest:
        description: Commit SHA of the signer workflow.
        required: false
        type: string
        default: ""
      bundle-from-oci:
        description: >
          Read the attestation from the OCI referrer instead of GitHub's
          attestation API. Slower to set up (needs registry auth) but
          INDEPENDENT OF REPOSITORY OWNERSHIP — attestations do not follow a
          repository transfer, and the API lookup 404s afterwards under both
          the old and the new owner. Requires the producer to have set
          `push-to-registry: true`.
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    name: Verify the image as a consumer would
    runs-on: ubuntu-latest
    # Hang guard, not a budget: one registry read and one verify.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # resolve the image from the registry; no write, ever
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            search.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443

      # `gh attestation verify` resolves an oci:// subject through the
      # registry, so it needs to be authenticated even for a public image.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify against the declared identity
        env:
          GH_TOKEN: ${{ github.token }}
          UNTRUSTED_IMAGE: ${{ inputs.image }}
          UNTRUSTED_DIGEST: ${{ inputs.digest }}
          UNTRUSTED_SOURCE_REPO: ${{ inputs.source-repo }}
          UNTRUSTED_SOURCE_REF: ${{ inputs.source-ref }}
          UNTRUSTED_SOURCE_DIGEST: ${{ inputs.source-digest }}
          UNTRUSTED_SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          UNTRUSTED_SIGNER_DIGEST: ${{ inputs.signer-digest }}
          UNTRUSTED_BUNDLE_FROM_OCI: ${{ inputs.bundle-from-oci }}
        run: |
          set -euo pipefail

          if [[ ! ${UNTRUSTED_DIGEST} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest must be sha256:<64 hex>, got '${UNTRUSTED_DIGEST}'"
            exit 1
          fi
          if [[ ${UNTRUSTED_IMAGE} == *:* || ${UNTRUSTED_IMAGE} == *@* ]]; then
            echo "::error::image must carry no tag and no digest, got '${UNTRUSTED_IMAGE}'"
            exit 1
          fi

          # Appended only when supplied, so an unset value cannot become an
          # empty-string pin that silently matches nothing.
          extra=()
          if [[ -n ${UNTRUSTED_SIGNER_DIGEST} ]]; then
            extra+=(--signer-digest "${UNTRUSTED_SIGNER_DIGEST}")
          else
            echo "::warning::no signer-digest supplied — the signer workflow's path is pinned but its ref is not"
          fi
          if [[ ${UNTRUSTED_BUNDLE_FROM_OCI} == "true" ]]; then
            extra+=(--bundle-from-oci)
          fi

          # Retried with stderr kept: at edtf v1.0.1 every artifact "failed"
          # here and the real cause — a blocked egress host, not bad
          # provenance — was invisible because stderr was swallowed (edtf#66).
          # The retries also cover the attestation API's read-after-write lag.
          verified="false"
          for attempt in 1 2 3; do
            if gh attestation verify "oci://${UNTRUSTED_IMAGE}@${UNTRUSTED_DIGEST}" \
              --repo "${UNTRUSTED_SOURCE_REPO}" \
              --source-ref "${UNTRUSTED_SOURCE_REF}" \
              --source-digest "${UNTRUSTED_SOURCE_DIGEST}" \
              --signer-workflow "${UNTRUSTED_SIGNER_WORKFLOW}" \
              --deny-self-hosted-runners \
              "${extra[@]}" \
              > /dev/null 2> "${RUNNER_TEMP}/verify-stderr.txt"; then
              verified="true"
              break
            fi
            [[ ${attempt} -lt 3 ]] && sleep 20
          done

          if [[ ${verified} != "true" ]]; then
            echo "::error::verification failed for ${UNTRUSTED_IMAGE}@${UNTRUSTED_DIGEST}"
            cat "${RUNNER_TEMP}/verify-stderr.txt"
            exit 1
          fi

          echo "::notice::verified ${UNTRUSTED_IMAGE}@${UNTRUSTED_DIGEST}"
          echo "::notice::  source ${UNTRUSTED_SOURCE_REPO} @ ${UNTRUSTED_SOURCE_REF}"
          echo "::notice::  signer ${UNTRUSTED_SIGNER_WORKFLOW}"
