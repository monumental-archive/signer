---
name: Trusted attest

# THE TRUSTED BUILDER. This workflow is the SLSA v1.0 Build L3 isolation
# boundary for every repository that calls it, and the single rule that makes
# it one is:
#
#   NOTHING IN THIS JOB IS SUPPLIED BY THE CALLER EXCEPT DECLARED VALUES.
#
# No `actions/checkout` — not of this repository and emphatically not of the
# caller's. No caller scripts, no build, no `cargo`, no `npm`. The job that
# holds `id-token: write` runs four steps, all of them from SHA-pinned
# first-party actions, over a single text file of digests.
#
# Why that rule and not a looser one. Inside a called workflow the `github`
# context is the CALLER's, so a bare `actions/checkout` here would fetch the
# calling repository at its tag and any `run:` step would then be executing
# code the caller controls — in the same job as the OIDC token, which every
# step can retrieve via $ACTIONS_ID_TOKEN_REQUEST_TOKEN. That reproduces
# exactly the property this boundary exists to remove. `gh attestation
# verify --help` states the criterion:
#
#   "have the build and attestation signing occur within a reusable workflow
#    whose execution cannot be influenced by input provided through the
#    caller workflow"
#
# and SLSA v1.0's Build L3 requirement states the property:
#
#   "Any secret material used for authenticating the provenance ... MUST NOT
#    be accessible to the environment running the user-defined build steps."
#
# The caller keeps its own `id-token: write` for registry trusted publishing,
# and a compromised build step there can still mint a Fulcio certificate —
# but it will bear the CALLER's workflow identity, and every documented
# verification pins `--signer-workflow` to THIS file. The reachable token is
# not the one that counts. That, precisely, is the L3 mechanism here.
#
# Known residual, stated rather than hidden: the subject digests are computed
# by the caller's build. A compromised build can ask this workflow to sign a
# digest of its choosing, and it will. SLSA puts that outside the Build track
# ("the SLSA level of an artifact is independent of the level of its
# dependencies"); reproducible builds are the leg that closes it, not more
# hardening here.

"on":
  workflow_call:
    inputs:
      subjects-artifact:
        description: >
          Name of the Actions artifact holding the checksums file. Upload ONLY
          the checksums file under this name — the artifact bytes themselves
          must not travel here.
        required: true
        type: string
      subjects-file:
        description: Filename of the checksums file inside that artifact.
        required: false
        type: string
        default: SUBJECTS.sha256
      subjects-digest:
        description: >
          SHA-256 of the checksums file, computed by the caller. Checked here
          before use: the artifact store is transport, not a trust boundary.
        required: true
        type: string
      bundle-artifact:
        description: Artifact name to publish the Sigstore bundle under.
        required: false
        type: string
        default: attestation-bundle
    outputs:
      bundle-artifact:
        description: Artifact name the Sigstore bundle was uploaded under.
        value: ${{ jobs.attest.outputs.bundle-artifact }}
      attestation-id:
        description: GitHub's ID for the stored attestation.
        value: ${{ jobs.attest.outputs.attestation-id }}

permissions: {}

jobs:
  attest:
    name: Sign provenance over the declared subjects
    runs-on: ubuntu-latest
    # Hang guard, not a budget: this job downloads one text file and signs it.
    timeout-minutes: 15
    permissions:
      # The signing identity. Present here and nowhere near a build step.
      id-token: write # OIDC: the Sigstore signing identity
      attestations: write # store the provenance GitHub serves to verifiers
      # Read-only, deliberately. This job must never be able to write to the
      # caller's releases or contents; a trusted builder that can publish is
      # a trusted builder that can be made to publish.
      contents: read
      #
      # These three are EXACTLY what a caller must grant, no more and no
      # less. A called workflow can only DOWNGRADE the caller's grant, never
      # elevate it — so requesting a scope the caller withheld kills the run
      # before any job starts, as `startup_failure` with no jobs and no
      # annotations. Nothing local catches it: actionlint validates each
      # repository in isolation and the contract spans both.
      #
      # `actions: read` was here and is deliberately gone. Downloading an
      # artifact from the SAME run does not need it, and every scope listed
      # here is one the caller is forced to hand a signing workflow.
    outputs:
      bundle-artifact: ${{ steps.names.outputs.bundle-artifact }}
      attestation-id: ${{ steps.attest.outputs.attestation-id }}
    steps:
      # Sigstore's signing and log endpoints, GitHub's TUF trust root and its
      # target store, and the Actions artifact plane. The last two TUF hosts
      # are the ones whose absence made every artifact report "provenance does
      # not match" when the truth was "could not fetch the trust root"
      # (edtf#66) — they are listed here for the same reason.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443

      # The ONLY thing that crosses the boundary: one file of digests.
      - name: Download the declared subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.subjects-artifact }}
          path: subjects

      # The artifact store is transport, not a trust boundary — the same
      # rule the caller already applies across its own job hand-off. Every
      # caller-supplied value is routed through env and prefixed UNTRUSTED_:
      # nothing the caller controls is ever expanded into `run:` code.
      - name: Verify the subjects file survived transport
        env:
          UNTRUSTED_SUBJECTS_FILE: ${{ inputs.subjects-file }}
          UNTRUSTED_SUBJECTS_DIGEST: ${{ inputs.subjects-digest }}
        run: |
          set -euo pipefail
          file="subjects/${UNTRUSTED_SUBJECTS_FILE}"
          if [[ ! -f ${file} ]]; then
            echo "::error::no subjects file at ${file}"
            exit 1
          fi
          # Refuse anything that is not a bare 64-hex digest. Without this the
          # comparison below could be satisfied by a crafted string.
          if [[ ! ${UNTRUSTED_SUBJECTS_DIGEST} =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::subjects-digest is not a sha256 hex digest"
            exit 1
          fi
          actual=$(sha256sum "${file}" | cut -d' ' -f1)
          if [[ ${actual} != "${UNTRUSTED_SUBJECTS_DIGEST}" ]]; then
            echo "::error::subjects file digest mismatch"
            echo "::error::declared ${UNTRUSTED_SUBJECTS_DIGEST}, received ${actual}"
            exit 1
          fi
          # A zero-subject attestation would be this workflow reporting
          # success for having signed nothing.
          count=$(grep -c . "${file}")
          if [[ ${count} -eq 0 ]]; then
            echo "::error::subjects file is empty"
            exit 1
          fi
          echo "SUBJECTS_FILE=${file}" >> "${GITHUB_ENV}"
          echo "::notice::${count} declared subjects, digest verified"
          cat "${file}"

      - name: Resolve output names
        id: names
        env:
          UNTRUSTED_BUNDLE_ARTIFACT: ${{ inputs.bundle-artifact }}
        run: |
          set -euo pipefail
          echo "bundle-artifact=${UNTRUSTED_BUNDLE_ARTIFACT}" >> "${GITHUB_OUTPUT}"

      # `subject-checksums` takes sha256sum's own output format and derives
      # every subject from it, so this job never needs — and never receives —
      # the artifact bytes.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        id: attest
        with:
          subject-checksums: ${{ env.SUBJECTS_FILE }}

      - name: Publish the Sigstore bundle back to the caller
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.bundle-artifact }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7
